name: Publish

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  check-changesets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      has_changesets: ${{ steps.check.outputs.has_changesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check for changesets
        id: check
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -qv 'README.md'; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Configure npm registry
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/krypton
          registry-url: https://registry.npmjs.org

      - name: Create release PR
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          commit: 'chore: version packages'
          title: 'chore: version packages'
          version: bun run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bun run build

      - name: Pack packages
        if: steps.changesets.outputs.hasChangesets == 'false'
        shell: bash
        run: |
          mkdir -p "$PACK_DEST"
          bun run pack:packages
        env:
          PACK_DEST: ${{ runner.temp }}/npm-packages

      - name: Publish packed packages to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          args=(--provenance)
          if [ -n "${PUBLISH_TAG:-}" ]; then
            args+=(--tag "$PUBLISH_TAG")
          fi

          tarballs=("$RUNNER_TEMP"/npm-packages/*.tgz)
          if [ "${#tarballs[@]}" -eq 0 ]; then
            echo "No package tarballs found."
            exit 1
          fi

          for tarball in "${tarballs[@]}"; do
            echo "Publishing $tarball"
            if output="$(npm publish "$tarball" "${args[@]}" 2>&1)"; then
              echo "$output"
              continue
            else
              status=$?
            fi

            echo "$output"
            if echo "$output" | grep -Eiq 'previously published|cannot publish over'; then
              echo "$tarball is already published; skipping."
              continue
            fi

            exit "$status"
          done

      - name: Create git tags
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bun x changeset tag

      - name: Push git tags
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: git push --follow-tags

  canary:
    needs: check-changesets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-changesets.outputs.has_changesets == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Build
        run: bun run build

      - name: Configure npm registry
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/krypton
          registry-url: https://registry.npmjs.org

      - name: Create canary version
        run: bun x changeset version --snapshot canary

      - name: Pack packages
        shell: bash
        run: |
          mkdir -p "$PACK_DEST"
          bun run pack:packages
        env:
          PACK_DEST: ${{ runner.temp }}/npm-packages

      - name: Publish canary to npm
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          args=(--provenance)
          if [ -n "${PUBLISH_TAG:-}" ]; then
            args+=(--tag "$PUBLISH_TAG")
          fi

          tarballs=("$RUNNER_TEMP"/npm-packages/*.tgz)
          if [ "${#tarballs[@]}" -eq 0 ]; then
            echo "No package tarballs found."
            exit 1
          fi

          for tarball in "${tarballs[@]}"; do
            echo "Publishing $tarball"
            if output="$(npm publish "$tarball" "${args[@]}" 2>&1)"; then
              echo "$output"
              continue
            else
              status=$?
            fi

            echo "$output"
            if echo "$output" | grep -Eiq 'previously published|cannot publish over'; then
              echo "$tarball is already published; skipping."
              continue
            fi

            exit "$status"
          done
        env:
          PUBLISH_TAG: canary
